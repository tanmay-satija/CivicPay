services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Copy .env.example to .env and set SQL_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - civicpay-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: localhost;127.0.0.1
      Database__Provider: SqlServer
      Database__Initialize: "true"
      Database__Seed: "true"
      ConnectionStrings__CivicPay: Server=sqlserver;Database=CivicPay;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Security__ApiKey: ${CIVICPAY_API_KEY:?Set CIVICPAY_API_KEY in .env}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
volumes:
  civicpay-sql:
